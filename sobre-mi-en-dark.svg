<svg xmlns="http://www.w3.org/2000/svg" width="860" height="368" viewBox="0 0 860 368" role="img" aria-labelledby="titulo desc"><title id="titulo">About me</title><desc id="desc">I finished the Web Application Development programme and I&#x27;m now in the second year of Cross-Platform Application Development at IES Lázaro Cárdenas. I&#x27;m most interested in full stack development: I enjoy learning new technologies and putting them into practice in my own projects. I&#x27;m curious about how things work, I like learning on my own and I keep getting better with every project.</desc><style>@font-face{font-family:'JA Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JA Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JA Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JA Sans';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}.cuerpo{font-family:'JA Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:400;font-size:15px;letter-spacing:-0.003em;font-kerning:normal}.mono-pequeno{font-family:'JA Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:400;font-size:10.5px;letter-spacing:0.03em;font-kerning:normal}.pequeno-fuerte{font-family:'JA Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:500;font-size:13px;letter-spacing:0em;font-kerning:normal}.seccion{font-family:'JA Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:500;font-size:11px;letter-spacing:0.12em;font-kerning:normal}</style><rect x="0.5" y="0.5" width="859" height="367" rx="12" fill="#0d1117" stroke="#262c36"/><text x="28" y="38" class="seccion" fill="#7c9dff">01</text><text x="54.5" y="38" class="seccion" fill="#9198a1">ABOUT ME</text><line x1="28" y1="56.5" x2="832" y2="56.5" stroke="#262c36"/><text x="28" y="102" class="cuerpo" fill="#e6edf3">I finished the Web Application Development programme and I&#x27;m</text><text x="28" y="127" class="cuerpo" fill="#e6edf3">now in the second year of Cross-Platform Application</text><text x="28" y="152" class="cuerpo" fill="#e6edf3">Development at IES Lázaro Cárdenas. I&#x27;m most interested in full</text><text x="28" y="177" class="cuerpo" fill="#e6edf3">stack development: I enjoy learning new technologies and putting</text><text x="28" y="202" class="cuerpo" fill="#e6edf3">them into practice in my own projects.</text><text x="28" y="239" class="cuerpo" fill="#9198a1">I&#x27;m curious about how things work, I like learning on my own and I</text><text x="28" y="264" class="cuerpo" fill="#9198a1">keep getting better with every project.</text><line x1="522.5" y1="86" x2="522.5" y2="338" stroke="#262c36"/><text x="548" y="98" class="mono-pequeno" fill="#9198a1">BASED IN</text><text x="548" y="118" class="pequeno-fuerte" fill="#e6edf3">Collado Villalba, Community of Madrid</text><text x="548" y="152" class="mono-pequeno" fill="#9198a1">NOW</text><text x="548" y="172" class="pequeno-fuerte" fill="#e6edf3">2nd year of DAM · IES Lázaro Cárdenas</text><text x="548" y="206" class="mono-pequeno" fill="#9198a1">QUALIFICATION</text><text x="548" y="226" class="pequeno-fuerte" fill="#e6edf3">Higher Technician in Web Application</text><text x="548" y="244" class="pequeno-fuerte" fill="#e6edf3">Development</text><text x="548" y="278" class="mono-pequeno" fill="#9198a1">LANGUAGES</text><text x="548" y="298" class="pequeno-fuerte" fill="#e6edf3">Spanish, native · English, limited working</text><text x="548" y="316" class="pequeno-fuerte" fill="#e6edf3">proficiency</text></svg>
