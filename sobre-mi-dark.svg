<svg xmlns="http://www.w3.org/2000/svg" width="860" height="350" viewBox="0 0 860 350" role="img" aria-labelledby="titulo desc"><title id="titulo">Sobre mí</title><desc id="desc">Terminé el ciclo de Desarrollo de Aplicaciones Web y ahora curso 2.º de Desarrollo de Aplicaciones Multiplataforma en el IES Lázaro Cárdenas. Me interesa sobre todo el desarrollo full stack: disfruto aprendiendo tecnologías nuevas y poniéndolas en práctica en proyectos propios. Tengo curiosidad por entender cómo funcionan las cosas, aprender por mi cuenta y seguir mejorando con cada proyecto.</desc><style>@font-face{font-family:'JA Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JA Mono';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JA Sans';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JA Sans';font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}.cuerpo{font-family:'JA Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:400;font-size:15px;letter-spacing:-0.003em;font-kerning:normal}.mono-pequeno{font-family:'JA Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:400;font-size:10.5px;letter-spacing:0.03em;font-kerning:normal}.pequeno-fuerte{font-family:'JA Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:500;font-size:13px;letter-spacing:0em;font-kerning:normal}.seccion{font-family:'JA Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-weight:500;font-size:11px;letter-spacing:0.12em;font-kerning:normal}</style><rect x="0.5" y="0.5" width="859" height="349" rx="12" fill="#0d1117" stroke="#262c36"/><text x="28" y="38" class="seccion" fill="#7c9dff">01</text><text x="54.5" y="38" class="seccion" fill="#9198a1">SOBRE MÍ</text><line x1="28" y1="56.5" x2="832" y2="56.5" stroke="#262c36"/><text x="28" y="102" class="cuerpo" fill="#e6edf3">Terminé el ciclo de Desarrollo de Aplicaciones Web y ahora curso</text><text x="28" y="127" class="cuerpo" fill="#e6edf3">2.º de Desarrollo de Aplicaciones Multiplataforma en el IES Lázaro</text><text x="28" y="152" class="cuerpo" fill="#e6edf3">Cárdenas. Me interesa sobre todo el desarrollo full stack: disfruto</text><text x="28" y="177" class="cuerpo" fill="#e6edf3">aprendiendo tecnologías nuevas y poniéndolas en práctica en</text><text x="28" y="202" class="cuerpo" fill="#e6edf3">proyectos propios.</text><text x="28" y="239" class="cuerpo" fill="#9198a1">Tengo curiosidad por entender cómo funcionan las cosas,</text><text x="28" y="264" class="cuerpo" fill="#9198a1">aprender por mi cuenta y seguir mejorando con cada proyecto.</text><line x1="522.5" y1="86" x2="522.5" y2="320" stroke="#262c36"/><text x="548" y="98" class="mono-pequeno" fill="#9198a1">VIVO EN</text><text x="548" y="118" class="pequeno-fuerte" fill="#e6edf3">Collado Villalba, Comunidad de Madrid</text><text x="548" y="152" class="mono-pequeno" fill="#9198a1">AHORA</text><text x="548" y="172" class="pequeno-fuerte" fill="#e6edf3">2.º de DAM · IES Lázaro Cárdenas</text><text x="548" y="206" class="mono-pequeno" fill="#9198a1">TITULACIÓN</text><text x="548" y="226" class="pequeno-fuerte" fill="#e6edf3">Técnico Superior en Desarrollo de</text><text x="548" y="244" class="pequeno-fuerte" fill="#e6edf3">Aplicaciones Web</text><text x="548" y="278" class="mono-pequeno" fill="#9198a1">IDIOMAS</text><text x="548" y="298" class="pequeno-fuerte" fill="#e6edf3">Español, nativo · Inglés, profesional básico</text></svg>
