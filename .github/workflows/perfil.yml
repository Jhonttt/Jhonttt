# Vuelve a dibujar el perfil.
#
# - Cada día, para que el calendario y los lenguajes estén al día.
# - Al cambiar datos/perfil.json, los scripts o las fuentes, para que el cambio
#   se vea sin tener que generar nada a mano.
#
# Los SVG se publican en la rama `salida`, reescrita con un único commit cada
# vez: main no recibe commits automáticos, y como `salida` no es la rama
# principal, esos commits no cuentan en el calendario de contribuciones.
#
# Secretos:
# - PERFIL_TOKEN (opcional): token personal con lectura de los repositorios
#   privados, para la actividad privada. Sin él, solo sale la pública.
#
# Los lenguajes salen solo de los repositorios PÚBLICOS, a propósito.
name: Perfil

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
    paths:
      - "datos/**"
      - "scripts/**"
      - "assets/source/**"
      - ".github/workflows/perfil.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: perfil
  cancel-in-progress: false

jobs:
  dibujar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Dependencias
        run: pip install -r scripts/requirements.txt

      - name: Sobre mí, trayectoria, stack y contacto
        working-directory: scripts
        run: python ficha.py

      - name: Actividad
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERFIL_TOKEN: ${{ secrets.PERFIL_TOKEN }}
        run: python actividad.py

      - name: Banner
        working-directory: scripts
        run: python banner.py

      - name: Publicar en la rama salida, si ha cambiado algo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/salida" "$RUNNER_TEMP/previo"
          cp assets/*.svg "$RUNNER_TEMP/salida/"
          if git fetch -q --depth=1 origin salida 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/previo"
            if diff -rq "$RUNNER_TEMP/previo" "$RUNNER_TEMP/salida" >/dev/null; then
              echo "Nada que actualizar."
              exit 0
            fi
          fi
          cd "$RUNNER_TEMP/salida"
          git init -q -b salida
          git config user.name "Jhonttt"
          git config user.email "235171212+Jhonttt@users.noreply.github.com"
          git add .
          git commit -q -m "Perfil generado el $(date -u +%F)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" salida
